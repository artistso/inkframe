name: InkFrame Master Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Assets
        # Building both APK and AAB as requested
        run: ./gradlew assembleDebug bundleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inkframe-build-package
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
