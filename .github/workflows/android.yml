name: InkFrame Base Alpha

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Base Alpha APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Base APK
        # Simple assembleDebug is the most stable path for a base version
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2

      - name: Upload Base APK
        uses: actions/upload-artifact@v4
        with:
          name: inkframe-base-alpha
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-base
          name: InkFrame Studio - Base Alpha
          body: |
            ## High-Stability Base Version
            This is the foundation build for **InkFrame Studio**.
            
            - **Status:** Stable Alpha
            - **Platform:** Android (Tablet/Stylus Optimized)
            
            ### Installed Features:
            - Andrew Kramer Saber Glow (Flicker active)
            - Kim Jung Gi Perspective Engine
            - Proko Structural Nodes
            - Fibonacci Organic UI
            
            *Future updates will push technical improvements to this foundation.*
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
