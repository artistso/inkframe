name: InkFrame Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-overwrite-existing: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        # We use assembleRelease to generate the production-ready APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          # This creates a dynamic "Master Build" tag so it shows on the front page
          tag_name: latest
          name: InkFrame Studio - Master Build
          body: |
            ## The Glass Horizon Build
            
            This is the latest production build of **InkFrame Studio**, forged from our partnership.
            
            ### Master Features Included:
            - **Andrew Kramer Saber Glow**: Energetic plasma-flicker ink trails.
            - **Kim Jung Gi Perspective**: Real-time curvilinear fisheye grids.
            - **Stan Proko Nodes**: High-intensity structural landmarks for sculpting.
            - **CSP Vector Magnet**: Seamless path snapping and merging.
            - **Fibonacci Bloom**: Organic mathematical UI expansion.
            - **Smart Shaping**: Rough sketches snap to perfect geometry.
            
            *Download the APK below to install on your Android device.*
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
